name: Myco PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Myco review
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@v1
        env:
          # Multi-repo env vars — injected directly since they are not action inputs yet
          MULTI_REPO_ENABLED: 'true'
          MULTI_REPO_MAP: '{"@myco-demo/shared-utils":"vvkmj/myco-demo-shared-utils"}'
          MULTI_REPO_GITHUB_TOKEN: ${{ github.token }}
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          llm_provider: openai
          api_key: ${{ secrets.LLM_API_KEY }}
          litellm_base_url: https://api.groq.com/openai/v1
          litellm_model: openai/gpt-oss-120b
          min_severity: P2
          post_github_comments: 'true'
          ci_gate: 'true'
          gate_min_severity: P1
          metrics_endpoint: ${{ secrets.METRICS_ENDPOINT || 'https://example.com/metrics' }}
          metrics_api_key: ${{ secrets.METRICS_API_KEY || 'placeholder' }}
          client_id: placement-preparation-buddy
