name: Myco PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Myco review
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          api_key: ${{ secrets.LLM_API_KEY }}
          litellm_base_url: ${{ vars.LITELLM_BASE_URL }}
          litellm_model: ${{ vars.LITELLM_MODEL }}
          min_severity: P2
          post_github_comments: ${{ vars.MYCO_POST_COMMENTS || 'false' }}
          ci_gate: 'true'
          gate_min_severity: P1
          multi_repo_enabled: 'true'
          multi_repo_map: |
            {
              "@myco-demo/shared-utils": "vvkmj/myco-demo-shared-utils"
            }
          metrics_endpoint: ${{ secrets.METRICS_ENDPOINT || 'https://example.com/metrics' }}
          metrics_api_key: ${{ secrets.METRICS_API_KEY || 'placeholder' }}
          client_id: placement-preparation-buddy
