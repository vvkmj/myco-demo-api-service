name: Myco PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Myco review
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          api_key: ${{ secrets.LLM_API_KEY }}
          litellm_base_url: ${{ vars.LITELLM_BASE_URL }}
          litellm_model: ${{ vars.LITELLM_MODEL }}
          min_severity: ${{ vars.MYCO_MIN_SEVERITY || 'P2' }}
          post_github_comments: 'true'
          ci_gate: 'true'
          gate_min_severity: 'P1'
          # Multi-repo: tell Myco to check the upstream shared-utils package
          multi_repo_enabled: 'true'
          multi_repo_map: |
            {
              "@myco-demo/shared-utils": "vvkmj/myco-demo-shared-utils"
            }
          multi_repo_tokens: ${{ secrets.CROSS_REPO_PAT && format('{{"vvkmj/myco-demo-shared-utils":"{0}"}}', secrets.CROSS_REPO_PAT) || '{}' }}
          metrics_endpoint: ${{ secrets.METRICS_ENDPOINT }}
          metrics_api_key: ${{ secrets.METRICS_API_KEY }}
          client_id: ${{ vars.MYCO_CLIENT_ID }}
