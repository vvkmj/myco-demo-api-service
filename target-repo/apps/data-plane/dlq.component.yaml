# yaml-language-server: $schema=https://motorqschema.blob.core.windows.net/tars/component-schema.json
kind: Component
metadata:
  name: dlq
  description: Dead Letter Queue processor for Data Router System that retries failed messages from the DLQ

parameters:
  # Connection Pool configs
  - name: min_pg_connections
    required: false
    default: '2'
  - name: max_pg_connections
    required: false
    default: '10'
  - name: pg_pool_idle_timeout
    required: false
    default: '30000'
  - name: pg_pool_acquire_timeout
    required: false
    default: '60000'
  - name: pg_pool_reapeat_interval
    required: false
    default: '1000'

  # Storage Account for Checkpointing
  - name: storage_account_connection_string
    required: true
    expose_as_secure: true

  # Control Plane configs
  - name: control_plane_base_url
    required: true

  # Azure Auth configs (for DLQ to authenticate with Control Plane)
  - name: azure_data_plane_client_id
    required: false
    default: ''
  - name: azure_data_plane_client_secret
    required: false
    default: ''
    expose_as_secure: true
  - name: azure_data_plane_tenant_id
    required: false
    default: ''
  - name: azure_service_scope
    required: false
    default: ''

  # EventHub Consumer configs
  - name: eventhub_max_wait_time
    required: false
    default: '5'
  - name: eventhub_max_batch_size
    required: false
    default: '2000'
  - name: eventhub_prefetch_count
    required: false
    default: '6000'
  - name: eventhub_max_buffer_messages
    required: false
    default: '10000'
  - name: eventhub_min_buffer_messages
    required: false
    default: '0'

  # Pulsar Consumer configs
  - name: pulsar_fetch_rate
    required: false
    default: '50'
  - name: pulsar_max_wait_time
    required: false
    default: '2'
  - name: pulsar_max_buffer_messages
    required: false
    default: '10000'
  - name: pulsar_min_buffer_messages
    required: false
    default: '200'

  # Producer configs
  - name: eventhub_partition_count
    required: false
    default: '1'
  - name: pulsar_partition_count
    required: false
    default: '1'
  - name: producer_buffer_flush_time
    required: false
    default: '5000'
  - name: producer_retry_max_retries
    required: false
    default: '3'
  - name: producer_retry_initial_delay
    required: false
    default: '100'
  - name: producer_retry_max_delay
    required: false
    default: '1000'

  # Pulsar Producer configs
  - name: pulsar_batching_max_messages
    required: false
    default: '100'
  - name: pulsar_batching_max_publish_delay
    required: false
    default: '1000'
  - name: pulsar_send_timeout
    required: false
    default: '30000'

  # DLQ configs
  - name: dlq_static_interval_in_secs
    required: false
    default: '60'
  - name: dlq_sticky_interval_in_secs
    required: false
    default: '30'
  - name: dlq_cleanup_interval_in_secs
    required: false
    default: '3600'
  - name: dlq_retry_delay_secs
    required: false
    default: '300'

  # Outlet Cache configs
  - name: outlet_cache_ttl_minutes
    required: false
    default: '30'

  # Logging configs
  - name: aks_node_name
    required: false
    default: ''
  - name: aks_namespace
    required: false
    default: ''
  - name: log_level
    required: false
    default: 'trace'

  # Deployment configs
  - name: replicas
    required: false
    default: '1'

  # Metrics configs
  - name: enable_metrics
    required: false
    default: 'true'

infra:
  - name: drs
    type: PostgresServer
    description: Database for drs

env_vars:
  - name: PGUSER
    value: "{{ infra.drs.user }}"
  - name: PGHOST
    value: "{{ infra.drs.host }}"
  - name: PGDATABASE
    value: "{{ infra.drs.database }}"
  - name: PGPASSWORD
    value: "{{ infra.drs.password }}"
    secure: true
  - name: PGPORT
    value: "{{ infra.drs.port }}"
  - name: PGSSLMODE
    value: "{{ infra.drs.pgrequiressl }}"
deployment:
  type: webjob
  command: ["sh", "-c", "node run.cjs apps/data-plane/dist/dlq.js"]
  replicas: "{{ parameters.replicas }}"
  metrics:
    podLabels:
      motorq.com/metrics-capable: 'true'
      motorq.com/metrics-enabled: '{{ parameters.enablemetrics }}'
